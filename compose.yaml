services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local database password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - studenthub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studenthub -d studenthub']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  studenthub-postgres:
